# Nome da Aplicação
spring.application.name=integrasaude-api

# Porta do Servidor
server.port=8080
server.servlet.context-path=/api

# Configuração do Banco de Dados (Exemplo com H2 em Memória para Desenvolvimento)
spring.datasource.url=jdbc:h2:mem:integrasaudedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração de Segurança JWT (Trocar em Produção)
