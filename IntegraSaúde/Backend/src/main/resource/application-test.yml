spring:
  datasource:
    url: jdbc:h2:mem:integrasaudedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false # Desativado em testes se usar ddl-auto create-drop

api:
  security:
    token:
      secret: chave-secreta-de-testes-integrasaude-123456